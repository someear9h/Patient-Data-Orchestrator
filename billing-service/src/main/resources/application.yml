server:
  port: 4001 # Billing service internal port

spring:
  application:
    name: billing-service
  datasource:
    # use the Docker service name 'billing-service-db'
    url: jdbc:postgresql://billing-service-db:5432/billingdb
    username: user
    password: password
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

# gRPC Server Configuration
grpc:
  server:
    port: 9090