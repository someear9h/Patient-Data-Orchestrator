server:
  port: 4001 # Billing service internal port

logging:
  level:
    root: WARN
    com.pm: WARN

spring:
  application:
    name: billing-service
  datasource:
    # use the Docker service name 'billing-service-db'
    url: jdbc:postgresql://billing-service-db:5432/billingdb
    username: user
    password: password
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 5000
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

# gRPC Server Configuration
grpc:
  server:
    port: 9090